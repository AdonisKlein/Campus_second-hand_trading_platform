apiVersion: v1
kind: ConfigMap
metadata: {name: campus-web-nginx}
data:
  default.conf: |
    server { listen 80; root /usr/share/nginx/html; index index.html;
      location /api/actuator/ { proxy_pass http://gateway:8080/actuator/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
      location /api/ { proxy_pass http://gateway:8080/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
      location / { try_files $uri $uri/ =404; }
    }
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec: {selector: {app: web}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: campus-web:dev
          ports: [{name: http, containerPort: 80}]
          volumeMounts: [{name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}]
          startupProbe: {httpGet: {path: /index.html, port: http}, periodSeconds: 3, failureThreshold: 20}
          readinessProbe: {httpGet: {path: /index.html, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /index.html, port: http}, periodSeconds: 15}
      volumes: [{name: nginx, configMap: {name: campus-web-nginx}}]

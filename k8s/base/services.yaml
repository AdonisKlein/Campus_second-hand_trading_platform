apiVersion: v1
kind: Service
metadata: {name: gateway}
spec: {selector: {app: gateway}, ports: [{name: http, port: 8080, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: campus-api-gateway:dev
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: campus-config}}]
          env:
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: campus-secrets, key: REDIS_PASSWORD}}}
            - {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: campus-secrets, key: INTERNAL_SERVICE_TOKEN}}}
            - {name: INTERNAL_JWT_SECRET, valueFrom: {secretKeyRef: {name: campus-secrets, key: INTERNAL_JWT_SECRET}}}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: account-service}
spec: {selector: {app: account}, ports: [{name: http, port: 8081, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: account-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: account}}
  template:
    metadata: {labels: {app: account}}
    spec:
      containers:
        - name: account
          image: campus-account-service:dev
          ports: [{name: http, containerPort: 8081}]
          envFrom: [{configMapRef: {name: campus-config}}]
          env:
            - {name: DB_URL, value: 'jdbc:mysql://campus-mysql:3306/campus_account?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'}
            - {name: DB_USERNAME, value: account_user}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: campus-secrets, key: ACCOUNT_DB_PASSWORD}}}
            - {name: VERIFICATION_PEPPER, valueFrom: {secretKeyRef: {name: campus-secrets, key: VERIFICATION_PEPPER}}}
            - {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: campus-secrets, key: INTERNAL_SERVICE_TOKEN}}}
            - {name: INTERNAL_JWT_SECRET, valueFrom: {secretKeyRef: {name: campus-secrets, key: INTERNAL_JWT_SECRET}}}
            - {name: SPRING_RABBITMQ_HOST, value: rabbitmq}
            - {name: SPRING_RABBITMQ_PORT, value: "5672"}
            - {name: SPRING_RABBITMQ_USERNAME, value: campus}
            - {name: SPRING_RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: campus-secrets, key: RABBITMQ_PASSWORD}}}
            - {name: MAIL_PASSWORD, valueFrom: {secretKeyRef: {name: campus-secrets, key: MAIL_PASSWORD, optional: true}}}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: marketplace-service}
spec: {selector: {app: marketplace}, ports: [{name: http, port: 8082, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: marketplace-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: marketplace}}
  template:
    metadata: {labels: {app: marketplace}}
    spec:
      securityContext: {fsGroup: 10001}
      containers:
        - name: marketplace
          image: campus-marketplace-service:dev
          ports: [{name: http, containerPort: 8082}]
          envFrom: [{configMapRef: {name: campus-config}}]
          env:
            - {name: DB_URL, value: 'jdbc:mysql://campus-mysql:3306/campus_marketplace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'}
            - {name: DB_USERNAME, value: marketplace_user}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: campus-secrets, key: MARKETPLACE_DB_PASSWORD}}}
            - {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: campus-secrets, key: INTERNAL_SERVICE_TOKEN}}}
            - {name: INTERNAL_JWT_SECRET, valueFrom: {secretKeyRef: {name: campus-secrets, key: INTERNAL_JWT_SECRET}}}
            - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: campus-secrets, key: RABBITMQ_PASSWORD}}}
          volumeMounts: [{name: media, mountPath: /app/uploads}]
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 15}
      volumes: [{name: media, persistentVolumeClaim: {claimName: campus-media-data}}]
---

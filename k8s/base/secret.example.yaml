# Example only. Copy the keys into a real Secret through your secret manager or
# generate k8s/overlays/ci/.env.secret. This file is intentionally not included
# by any kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: campus-secrets
  namespace: campus-market
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: replace-with-random-root-password
  ACCOUNT_DB_PASSWORD: replace-me
  MARKETPLACE_DB_PASSWORD: replace-me
  TRADING_DB_PASSWORD: replace-me
  GOVERNANCE_DB_PASSWORD: replace-me
  REDIS_PASSWORD: replace-me
  RABBITMQ_PASSWORD: replace-me
  VERIFICATION_PEPPER: replace-with-at-least-32-random-characters
  INTERNAL_SERVICE_TOKEN: replace-me
  INTERNAL_JWT_SECRET: replace-me
  MAIL_PASSWORD: replace-me

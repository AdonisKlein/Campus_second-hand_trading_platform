apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: campus-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: campus-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campus-backend
        app.kubernetes.io/part-of: campus-secondhand
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4
          command:
            - sh
            - -c
            - until mysqladmin ping -h campus-mysql -ucampus -p"$MYSQL_PASSWORD" --silent; do sleep 2; done
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: MYSQL_PASSWORD
      containers:
        - name: backend
          image: campus-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: campus-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: MYSQL_PASSWORD
            - name: VERIFICATION_PEPPER
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: VERIFICATION_PEPPER
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: media-data
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: campus-media-data
        - name: tmp
          emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
  name: campus-config
data:
  CORS_ALLOWED_ORIGINS: http://localhost:18080,http://127.0.0.1:18080
  MAIL_ENABLED: "true"
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_USERNAME: ci
  MAIL_PASSWORD: ci
  MAIL_FROM: no-reply@ci.campus.test
  MAIL_SMTP_AUTH: "false"
  MAIL_SSL_ENABLED: "false"
  MAIL_STARTTLS_ENABLED: "false"
  MAIL_STARTTLS_REQUIRED: "false"

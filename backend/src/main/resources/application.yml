server:
    port: 8080
    servlet:
        context-path: /api

spring:
    application:
        name: campus-secondhand
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/campus_secondhand?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:validate}
        open-in-view: false
        show-sql: ${JPA_SHOW_SQL:false}
        properties:
            hibernate:
                format_sql: true
    mail:
        host: ${MAIL_HOST:smtp.mailtrap.io}
        port: ${MAIL_PORT:2525}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

app:
    upload-dir: ${UPLOAD_DIR:uploads}

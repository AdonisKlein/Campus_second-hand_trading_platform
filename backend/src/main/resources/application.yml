server:
    port: 8080
    forward-headers-strategy: native
    servlet:
        context-path: /api
        session:
            timeout: 30m
            cookie:
                http-only: true
                same-site: lax
                secure: ${SESSION_COOKIE_SECURE:false}

spring:
    application:
        name: campus-secondhand
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 6MB
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/campus_secondhand?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:validate}
        open-in-view: false
        show-sql: ${JPA_SHOW_SQL:false}
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration
    session:
        store-type: jdbc
        jdbc:
            initialize-schema: never
    mail:
        host: ${MAIL_HOST:smtpdm.aliyun.com}
        port: ${MAIL_PORT:465}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: ${MAIL_SMTP_AUTH:true}
                    connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
                    timeout: ${MAIL_READ_TIMEOUT_MS:10000}
                    writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
                    starttls:
                        enable: ${MAIL_STARTTLS_ENABLED:false}
                        required: ${MAIL_STARTTLS_REQUIRED:false}
                    ssl:
                        enable: ${MAIL_SSL_ENABLED:true}

app:
    upload-dir: ${UPLOAD_DIR:uploads}
    mail:
        enabled: ${MAIL_ENABLED:false}
        from: ${MAIL_FROM:}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
    verification:
        pepper: ${VERIFICATION_PEPPER}
    trading:
        purchase-request-minutes: ${PURCHASE_REQUEST_MINUTES:1440}
        handover-minutes: ${HANDOVER_MINUTES:4320}
        expiry-scan-ms: ${EXPIRY_SCAN_MS:60000}
    internal-jwt:
        enabled: ${INTERNAL_JWT_ENABLED:false}
        issuer: ${INTERNAL_JWT_ISSUER:campus-gateway}
        secret: ${INTERNAL_JWT_SECRET:}

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true
    health:
        mail:
            enabled: false

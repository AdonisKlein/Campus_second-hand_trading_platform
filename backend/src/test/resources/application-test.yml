spring:
    datasource:
        url: jdbc:h2:mem:campus_secondhand_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password:
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
    flyway:
        enabled: true
    session:
        store-type: jdbc
        jdbc:
            initialize-schema: never
app:
    verification:
        pepper: test-only-verification-pepper-at-least-32-bytes
management:
    health:
        mail:
            enabled: false

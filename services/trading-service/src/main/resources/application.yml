server:
  port: 8083
  forward-headers-strategy: framework
spring:
  application:
    name: campus-trading-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${TRADING_MESSAGING_ENABLED:false}
campus:
  trading:
    account-uri: ${ACCOUNT_SERVICE_URI:http://localhost:8081}
    marketplace-uri: ${MARKETPLACE_SERVICE_URI:http://localhost:8082}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
    internal-jwt-secret: ${INTERNAL_JWT_SECRET}
    purchase-request-minutes: ${PURCHASE_REQUEST_MINUTES:1440}
    handover-minutes: ${HANDOVER_MINUTES:4320}
    messaging-enabled: ${TRADING_MESSAGING_ENABLED:false}
    dependency-connect-timeout-ms: ${DEPENDENCY_CONNECT_TIMEOUT_MS:300}
    dependency-response-timeout-ms: ${DEPENDENCY_RESPONSE_TIMEOUT_MS:800}
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:dev}
    commit: ${GIT_COMMIT:local}
logging:
  structured:
    format:
      console: ecs

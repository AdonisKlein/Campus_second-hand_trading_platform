server:
  port: ${SERVER_PORT:8080}
  reactive:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: campus-api-gateway
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  session:
    store-type: redis
    timeout: 30m
  cloud:
    gateway:
      routes:
        - id: account
          uri: ${ACCOUNT_SERVICE_URI:http://localhost:8081}
          predicates: [Path=/api/auth/verification/**,/api/auth/register,/api/auth/password/reset,/api/users/**,/api/admin/users/**]
        - id: marketplace
          uri: ${MARKETPLACE_SERVICE_URI:http://localhost:8082}
          predicates: [Path=/api/items/**,/api/media/**,/api/messages/**,/api/search,/api/admin/items/**,/api/admin/messages/**]
        - id: trading
          uri: ${TRADING_SERVICE_URI:http://localhost:8083}
          predicates: [Path=/api/orders/**,/api/chat/**]
        - id: monolith-fallback
          uri: ${MONOLITH_URI:http://localhost:8088}
          predicates: [Path=/api/**]

campus:
  gateway:
    account-uri: ${ACCOUNT_SERVICE_URI:http://localhost:8081}
    monolith-uri: ${MONOLITH_URI:http://localhost:8088}
    redis-url: ${REDIS_URL:redis://localhost:6379}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
    internal-jwt-secret: ${INTERNAL_JWT_SECRET}
    cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
    cors-allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,X-XSRF-TOKEN,Authorization}
    secure-cookies: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

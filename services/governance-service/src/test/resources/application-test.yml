spring:
  datasource:
    url: jdbc:h2:mem:governance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false
campus:
  governance:
    account-uri: http://localhost:1
    marketplace-uri: http://localhost:1
    internal-service-token: test-internal-service-token-32-bytes
    internal-jwt-secret: test-internal-jwt-secret-at-least-32-bytes
    messaging-enabled: false

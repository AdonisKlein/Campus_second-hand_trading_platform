server:
  port: 8082
  forward-headers-strategy: framework
spring:
  application:
    name: campus-marketplace-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
campus:
  marketplace:
    account-uri: ${ACCOUNT_SERVICE_URI:http://localhost:8081}
    trading-uri: ${TRADING_SERVICE_URI:http://localhost:8083}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
    internal-jwt-secret: ${INTERNAL_JWT_SECRET}
    upload-dir: ${UPLOAD_DIR:uploads}
    dependency-connect-timeout-ms: ${DEPENDENCY_CONNECT_TIMEOUT_MS:300}
    dependency-response-timeout-ms: ${DEPENDENCY_RESPONSE_TIMEOUT_MS:800}
  account-profile-events:
    enabled: ${ACCOUNT_PROFILE_EVENTS_ENABLED:false}
  trading-events:
    enabled: ${TRADING_EVENTS_ENABLED:false}
    exchange: ${TRADING_EVENTS_EXCHANGE:campus.trading}
  governance-events:
    enabled: ${GOVERNANCE_EVENTS_ENABLED:false}
    exchange: ${GOVERNANCE_EVENTS_EXCHANGE:campus.governance}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

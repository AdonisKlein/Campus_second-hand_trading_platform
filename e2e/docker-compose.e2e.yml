services:
  mysql:
    restart: "no"
    healthcheck: {interval: 2s, timeout: 3s, retries: 30}
  redis:
    restart: "no"
    healthcheck: {interval: 2s, timeout: 3s, retries: 30}
  rabbitmq:
    restart: "no"
    healthcheck: {interval: 2s, timeout: 3s, retries: 30}
    volumes: !reset []
    environment:
      HOME: /tmp/rabbitmq
      RABBITMQ_ERLANG_COOKIE: e2e-only-rabbitmq-erlang-cookie
      RABBITMQ_MNESIA_BASE: /tmp/rabbitmq/mnesia
      RABBITMQ_PID_FILE: /tmp/rabbitmq/rabbitmq.pid
  api-gateway:
    restart: "no"
    environment:
      DEPENDENCY_CONNECT_TIMEOUT_MS: "3000"
      DEPENDENCY_RESPONSE_TIMEOUT_MS: "10000"
    healthcheck: {interval: 2s, timeout: 3s, retries: 45}
  account-service:
    restart: "no"
    healthcheck: {interval: 2s, timeout: 3s, retries: 45}
  marketplace-service:
    restart: "no"
    environment:
      DEPENDENCY_CONNECT_TIMEOUT_MS: "3000"
      DEPENDENCY_RESPONSE_TIMEOUT_MS: "10000"
    healthcheck: {interval: 2s, timeout: 3s, retries: 45}
  trading-service:
    restart: "no"
    environment:
      DEPENDENCY_CONNECT_TIMEOUT_MS: "3000"
      DEPENDENCY_RESPONSE_TIMEOUT_MS: "10000"
    healthcheck: {interval: 2s, timeout: 3s, retries: 45}
  governance-service:
    restart: "no"
    environment:
      DEPENDENCY_CONNECT_TIMEOUT_MS: "3000"
      DEPENDENCY_RESPONSE_TIMEOUT_MS: "10000"
    healthcheck: {interval: 2s, timeout: 3s, retries: 45}
  mailpit:
    restart: "no"
  web:
    restart: "no"
    healthcheck: {interval: 2s, timeout: 3s, retries: 30}

volumes:
  mysql-data:
    name: campus-secondhand-e2e-mysql-data
  media-data:
    name: campus-secondhand-e2e-media-data
  microservice-redis-data:
    name: campus-secondhand-e2e-redis-data
  microservice-rabbitmq-data:
    name: campus-secondhand-e2e-rabbitmq-data
  mailpit-data:
    name: campus-secondhand-e2e-mailpit-data

    <text x="205" y="292" text-anchor="middle" font-size="15" fill="#1e3a8a">http://localhost:5500</text>
    <rect x="380" y="200" width="210" height="160" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    </marker>
  </defs>
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <rect x="55" y="100" width="1070" height="420" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="590" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">Windows 本地开发/演示环境</text>
    <rect x="105" y="220" width="200" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

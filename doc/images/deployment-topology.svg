    <text x="1015" y="316" text-anchor="middle" font-size="15" fill="#4c1d95">campus_secondhand</text>
    <rect x="675" y="410" width="210" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>

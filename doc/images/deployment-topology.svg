    <text x="485" y="324" text-anchor="middle" font-size="15" fill="#166534">python http.server 可选</text>
    <rect x="675" y="200" width="210" height="160" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="780" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#c2410c">后端服务</text>
    <text x="780" y="272" text-anchor="middle" font-size="15" fill="#7c2d12">backend/</text>
    <text x="780" y="298" text-anchor="middle" font-size="15" fill="#7c2d12">mvn spring-boot:run</text>
    <text x="780" y="324" text-anchor="middle" font-size="15" fill="#7c2d12">http://localhost:8080/api</text>
    <rect x="945" y="220" width="140" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>

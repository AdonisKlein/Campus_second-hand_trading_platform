<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <rect width="1180" height="620" fill="#f8fafc"/>
  <text x="590" y="48" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">用户典型操作路径图</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <rect x="70" y="120" width="170" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">打开首页</text>
    <text x="155" y="180" text-anchor="middle" font-size="14" fill="#475569">浏览商品</text>
    <rect x="300" y="120" width="170" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="385" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">注册/登录</text>
    <text x="385" y="180" text-anchor="middle" font-size="14" fill="#475569">用户名或邮箱</text>
    <rect x="530" y="120" width="170" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="615" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#c2410c">发布商品</text>
    <text x="615" y="180" text-anchor="middle" font-size="14" fill="#475569">标题/分类/价格</text>
    <rect x="760" y="120" width="170" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="845" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">查看详情</text>
    <text x="845" y="180" text-anchor="middle" font-size="14" fill="#475569">留言沟通</text>
    <rect x="990" y="120" width="140" height="80" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="1060" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#0e7490">创建订单</text>
    <text x="1060" y="180" text-anchor="middle" font-size="14" fill="#475569">状态更新</text>
    <line x1="240" y1="160" x2="300" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="470" y1="160" x2="530" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="700" y1="160" x2="760" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="930" y1="160" x2="990" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="180" y="320" width="230" height="110" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="295" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">个人中心</text>
    <text x="295" y="386" text-anchor="middle" font-size="15" fill="#475569">资料修改 / 找回密码</text>
    <text x="295" y="412" text-anchor="middle" font-size="15" fill="#475569">退出登录</text>
    <rect x="480" y="320" width="230" height="110" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="595" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">订单管理</text>
    <text x="595" y="386" text-anchor="middle" font-size="15" fill="#475569">CREATED / CONFIRMED</text>
    <text x="595" y="412" text-anchor="middle" font-size="15" fill="#475569">COMPLETED / CANCELLED</text>
    <rect x="780" y="320" width="230" height="110" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="895" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">管理中心</text>
    <text x="895" y="386" text-anchor="middle" font-size="15" fill="#475569">用户 / 留言 / 商品</text>
    <text x="895" y="412" text-anchor="middle" font-size="15" fill="#475569">仅管理员可用</text>
    <path d="M385 200 C385 260 300 270 295 320" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1060 200 C1060 270 620 270 595 320" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M385 200 C445 280 820 270 895 320" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="270" y="505" width="640" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="590" y="536" text-anchor="middle" font-size="16" fill="#075985">普通用户完成交易闭环；管理员维护平台内容秩序</text>

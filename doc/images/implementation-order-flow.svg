<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <rect width="1180" height="620" fill="#f8fafc"/>
  <text x="590" y="48" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">订单创建与商品状态联动实现流程</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <rect x="70" y="130" width="170" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">用户点击下单</text>
    <text x="155" y="187" text-anchor="middle" font-size="14" fill="#475569">detail.js</text>
    <rect x="300" y="130" width="190" height="76" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="395" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">校验买家卖家</text>
    <text x="395" y="187" text-anchor="middle" font-size="14" fill="#475569">存在且未禁用</text>
    <rect x="550" y="130" width="190" height="76" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="645" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">校验商品</text>
    <text x="645" y="187" text-anchor="middle" font-size="14" fill="#475569">存在且卖家匹配</text>
    <rect x="800" y="130" width="190" height="76" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="895" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">校验状态</text>
    <text x="895" y="187" text-anchor="middle" font-size="14" fill="#475569">ON_SALE 且无订单</text>
    <rect x="300" y="320" width="190" height="82" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="395" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">保存订单</text>
    <text x="395" y="380" text-anchor="middle" font-size="14" fill="#166534">trade_orders.CREATED</text>
    <rect x="550" y="320" width="190" height="82" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="645" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#c2410c">更新商品</text>
    <text x="645" y="380" text-anchor="middle" font-size="14" fill="#7c2d12">items.status = SOLD</text>
    <rect x="800" y="320" width="190" height="82" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="895" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">返回结果</text>
    <text x="895" y="380" text-anchor="middle" font-size="14" fill="#4c1d95">ApiResponse.created</text>
    <rect x="450" y="490" width="280" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="590" y="523" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">任一校验失败：返回失败 message</text>
    <line x1="240" y1="168" x2="300" y2="168" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="490" y1="168" x2="550" y2="168" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="740" y1="168" x2="800" y2="168" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M895 206 C895 270 410 270 395 320" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="490" y1="361" x2="550" y2="361" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="740" y1="361" x2="800" y2="361" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M395 206 C450 255 520 430 560 490" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M645 206 C665 280 665 420 620 490" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M895 206 C850 285 720 430 640 490" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  </g>
</svg>

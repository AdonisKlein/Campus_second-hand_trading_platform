<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">概要设计组件图</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">
    <rect x="60" y="105" width="260" height="430" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">前端组件</text>
    <rect x="95" y="175" width="190" height="48" rx="8" fill="#fff"/><text x="190" y="205" text-anchor="middle">页面 HTML</text>
    <rect x="95" y="245" width="190" height="48" rx="8" fill="#fff"/><text x="190" y="275" text-anchor="middle">页面脚本 JS</text>
    <rect x="95" y="315" width="190" height="48" rx="8" fill="#fff"/><text x="190" y="345" text-anchor="middle">公共 API 配置</text>
    <rect x="95" y="385" width="190" height="48" rx="8" fill="#fff"/><text x="190" y="415" text-anchor="middle">样式与图片资源</text>
    <rect x="410" y="90" width="360" height="485" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="590" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#c2410c">后端组件</text>
    <rect x="455" y="165" width="120" height="48" rx="8" fill="#fff"/><text x="515" y="195" text-anchor="middle">用户</text>
    <rect x="605" y="165" width="120" height="48" rx="8" fill="#fff"/><text x="665" y="195" text-anchor="middle">商品</text>
    <rect x="455" y="245" width="120" height="48" rx="8" fill="#fff"/><text x="515" y="275" text-anchor="middle">留言</text>
    <rect x="605" y="245" width="120" height="48" rx="8" fill="#fff"/><text x="665" y="275" text-anchor="middle">订单</text>
    <rect x="455" y="325" width="120" height="48" rx="8" fill="#fff"/><text x="515" y="355" text-anchor="middle">管理员</text>
    <rect x="605" y="325" width="120" height="48" rx="8" fill="#fff"/><text x="665" y="355" text-anchor="middle">公共模块</text>
    <rect x="485" y="430" width="210" height="56" rx="8" fill="#fff"/><text x="590" y="464" text-anchor="middle">Repository / JPA</text>
    <rect x="870" y="155" width="250" height="140" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="995" y="195" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">MySQL</text>
    <text x="995" y="230" text-anchor="middle">users/items/messages</text><text x="995" y="255" text-anchor="middle">orders/verification</text>
    <rect x="870" y="380" width="250" height="110" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="995" y="425" text-anchor="middle" font-size="20" font-weight="700" fill="#0e7490">SMTP 邮件服务</text>
    <text x="995" y="458" text-anchor="middle">验证码发送</text>
    <line x1="320" y1="320" x2="410" y2="320" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="365" y="300" text-anchor="middle" fill="#475569">HTTP JSON</text>
    <line x1="770" y1="455" x2="870" y2="245" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="815" y="345" fill="#475569">JPA</text>
    <line x1="770" y1="350" x2="870" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="805" y="400" fill="#475569">Mail</text>
  </g>

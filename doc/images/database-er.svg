<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
  <rect width="1180" height="720" fill="#f8fafc"/>
  <text x="590" y="46" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">数据库 ER 关系图</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">
    <g>
      <rect x="70" y="100" width="250" height="230" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <rect x="70" y="100" width="250" height="42" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="195" y="127" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">users</text>
      <text x="90" y="168" fill="#334155">PK id</text>
      <text x="90" y="194" fill="#334155">username / password_hash</text>
      <text x="90" y="220" fill="#334155">nickname / phone / email</text>
      <text x="90" y="246" fill="#334155">role / status</text>
      <text x="90" y="272" fill="#334155">login_failed_count</text>
      <text x="90" y="298" fill="#334155">locked_until / created_at</text>
    </g>
    <g>
      <rect x="465" y="95" width="250" height="230" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <rect x="465" y="95" width="250" height="42" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="590" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">items</text>
      <text x="485" y="163" fill="#334155">PK id</text>
      <text x="485" y="189" fill="#334155">title / category / price</text>
      <text x="485" y="215" fill="#334155">description / image_url</text>
      <text x="485" y="241" fill="#334155">FK seller_id -> users.id</text>
      <text x="485" y="267" fill="#334155">status</text>
      <text x="485" y="293" fill="#334155">created_at</text>
    </g>
    <g>
      <rect x="860" y="100" width="250" height="200" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
      <rect x="860" y="100" width="250" height="42" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <text x="985" y="127" text-anchor="middle" font-size="18" font-weight="700" fill="#c2410c">messages</text>
      <text x="880" y="168" fill="#334155">PK id</text>
      <text x="880" y="194" fill="#334155">FK item_id -> items.id</text>
      <text x="880" y="220" fill="#334155">FK sender_id -> users.id</text>
      <text x="880" y="246" fill="#334155">FK receiver_id -> users.id</text>
      <text x="880" y="272" fill="#334155">content / created_at</text>
    </g>
    <g>
      <rect x="465" y="420" width="250" height="190" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <rect x="465" y="420" width="250" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="590" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">trade_orders</text>
      <text x="485" y="488" fill="#334155">PK id</text>
      <text x="485" y="514" fill="#334155">FK item_id -> items.id</text>
      <text x="485" y="540" fill="#334155">FK buyer_id -> users.id</text>
      <text x="485" y="566" fill="#334155">FK seller_id -> users.id</text>
      <text x="485" y="592" fill="#334155">status / created_at</text>
    </g>
    <g>
      <rect x="70" y="450" width="250" height="160" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
      <rect x="70" y="450" width="250" height="42" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
      <text x="195" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0e7490">email_verification</text>
      <text x="90" y="518" fill="#334155">PK id</text>
      <text x="90" y="544" fill="#334155">email / code</text>
      <text x="90" y="570" fill="#334155">expires_at / attempts</text>
      <text x="90" y="596" fill="#334155">used</text>
    </g>
    <line x1="320" y1="210" x2="465" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="392" y="196" text-anchor="middle" fill="#475569">1:N 发布</text>
    <line x1="715" y1="200" x2="860" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="787" y="186" text-anchor="middle" fill="#475569">1:N 留言</text>
    <line x1="590" y1="325" x2="590" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="642" y="375" fill="#475569">1:订单</text>
    <path d="M320 280 C390 360 390 520 465 540" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="430" fill="#475569">买家/卖家</text>
    <path d="M320 180 C610 20 790 60 900 140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="600" y="76" text-anchor="middle" fill="#475569">发送者/接收者</text>
  </g>
</svg>

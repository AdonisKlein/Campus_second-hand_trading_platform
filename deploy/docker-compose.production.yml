services:
  mysql:
    image: ${IMAGE_NAMESPACE}/campus-mysql:${IMAGE_TAG}
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=30
      - --table-open-cache=200
      - --performance-schema=OFF
    deploy:
      resources:
        limits: {memory: 320M}
        reservations: {memory: 192M}

  redis:
    image: ${IMAGE_NAMESPACE}/campus-redis:${IMAGE_TAG}
    deploy:
      resources:
        limits: {memory: 128M}
        reservations: {memory: 32M}

  rabbitmq:
    image: ${IMAGE_NAMESPACE}/campus-rabbitmq:${IMAGE_TAG}
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"
    deploy:
      resources:
        limits: {memory: 256M}
        reservations: {memory: 96M}

  api-gateway:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms24m -Xmx80m -XX:MaxMetaspaceSize=112m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=24m -XX:MaxDirectMemorySize=32m -XX:TieredStopAtLevel=1 -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Dreactor.netty.ioWorkerCount=2"
      SPRING_JMX_ENABLED: "false"
    deploy:
      resources:
        limits: {memory: 320M}
        reservations: {memory: 96M}

  account-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms24m -Xmx80m -XX:MaxMetaspaceSize=112m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=24m -XX:MaxDirectMemorySize=16m -XX:TieredStopAtLevel=1 -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_JMX_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "16"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "1"
    deploy:
      resources:
        limits: {memory: 352M}
        reservations: {memory: 96M}

  marketplace-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms24m -Xmx80m -XX:MaxMetaspaceSize=112m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=24m -XX:MaxDirectMemorySize=16m -XX:TieredStopAtLevel=1 -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_JMX_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "16"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "1"
    deploy:
      resources:
        limits: {memory: 352M}
        reservations: {memory: 96M}

  trading-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms24m -Xmx80m -XX:MaxMetaspaceSize=112m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=24m -XX:MaxDirectMemorySize=16m -XX:TieredStopAtLevel=1 -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_JMX_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "16"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "1"
    deploy:
      resources:
        limits: {memory: 352M}
        reservations: {memory: 96M}

  governance-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms24m -Xmx80m -XX:MaxMetaspaceSize=112m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=24m -XX:MaxDirectMemorySize=16m -XX:TieredStopAtLevel=1 -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_JMX_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "16"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "1"
    deploy:
      resources:
        limits: {memory: 352M}
        reservations: {memory: 96M}

  web:
    deploy:
      resources:
        limits: {memory: 96M}
        reservations: {memory: 32M}

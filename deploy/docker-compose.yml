services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Set MARKETPLACE_DB_PASSWORD}
      TRADING_DB_PASSWORD: ${TRADING_DB_PASSWORD:?Set TRADING_DB_PASSWORD}
      GOVERNANCE_DB_PASSWORD: ${GOVERNANCE_DB_PASSWORD:?Set GOVERNANCE_DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes: [mysql-data:/var/lib/mysql, ./mysql/init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      # Use TCP: the image's temporary init server listens only on its Unix
      # socket and must not release dependent services before the final server.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", '${REDIS_PASSWORD:?Set REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD}'
    volumes: [microservice-redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes: [microservice-rabbitmq-data:/var/lib/rabbitmq]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 15}

  api-gateway:
    image: ${IMAGE_NAMESPACE:-campus-local}/campus-gateway:${IMAGE_TAG:-dev}
    build: ../services/api-gateway
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      ACCOUNT_SERVICE_URI: http://account-service:8081
      MARKETPLACE_SERVICE_URI: http://marketplace-service:8082
      TRADING_SERVICE_URI: http://trading-service:8083
      GOVERNANCE_SERVICE_URI: http://governance-service:8084
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?Set INTERNAL_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on: {redis: {condition: service_healthy}, account-service: {condition: service_healthy}, marketplace-service: {condition: service_healthy}, trading-service: {condition: service_healthy}, governance-service: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 20}

  account-service:
    image: ${IMAGE_NAMESPACE:-campus-local}/campus-account:${IMAGE_TAG:-dev}
    build: ../services/account-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_account?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: account_user
      DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
      VERIFICATION_PEPPER: ${VERIFICATION_PEPPER:?Set VERIFICATION_PEPPER}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?Set INTERNAL_JWT_SECRET}
      GOVERNANCE_EVENTS_ENABLED: "true"
      PUBLIC_PROFILE_EVENTS_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtpdm.aliyun.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SSL_ENABLED: ${MAIL_SSL_ENABLED:-true}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-false}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-false}
    depends_on: {mysql: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 20}

  marketplace-service:
    image: ${IMAGE_NAMESPACE:-campus-local}/campus-marketplace:${IMAGE_TAG:-dev}
    build: ../services/marketplace-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_marketplace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: marketplace_user
      DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Set MARKETPLACE_DB_PASSWORD}
      ACCOUNT_SERVICE_URI: http://account-service:8081
      TRADING_SERVICE_URI: http://trading-service:8083
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?Set INTERNAL_JWT_SECRET}
      TRADING_EVENTS_ENABLED: "true"
      GOVERNANCE_EVENTS_ENABLED: "true"
      ACCOUNT_PROFILE_EVENTS_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      UPLOAD_DIR: /app/uploads
    volumes: [media-data:/app/uploads]
    depends_on: {mysql: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, account-service: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 20}

  trading-service:
    image: ${IMAGE_NAMESPACE:-campus-local}/campus-trading:${IMAGE_TAG:-dev}
    build: ../services/trading-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_trading?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: trading_user
      DB_PASSWORD: ${TRADING_DB_PASSWORD:?Set TRADING_DB_PASSWORD}
      ACCOUNT_SERVICE_URI: http://account-service:8081
      MARKETPLACE_SERVICE_URI: http://marketplace-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?Set INTERNAL_JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      TRADING_MESSAGING_ENABLED: "true"
    depends_on: {mysql: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, account-service: {condition: service_healthy}, marketplace-service: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 20}

  governance-service:
    image: ${IMAGE_NAMESPACE:-campus-local}/campus-governance:${IMAGE_TAG:-dev}
    build: ../services/governance-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: governance_user
      DB_PASSWORD: ${GOVERNANCE_DB_PASSWORD:?Set GOVERNANCE_DB_PASSWORD}
      ACCOUNT_SERVICE_URI: http://account-service:8081
      MARKETPLACE_SERVICE_URI: http://marketplace-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?Set INTERNAL_JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      GOVERNANCE_MESSAGING_ENABLED: "true"
    # Serialise the two largest late-starting JVMs on small demo hosts.
    depends_on: {mysql: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, account-service: {condition: service_healthy}, marketplace-service: {condition: service_healthy}, trading-service: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health/readiness"], interval: 15s, timeout: 5s, retries: 20}

  web:
    image: ${IMAGE_NAMESPACE:-campus-local}/campus-web:${IMAGE_TAG:-dev}
    build: ../frontend
    restart: unless-stopped
    ports: ["${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"]
    depends_on: {api-gateway: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/index.html"], interval: 15s, timeout: 5s, retries: 12}
volumes:
  mysql-data: {name: campus-microservices-mysql-data}
  media-data: {name: campus-microservices-media-data}
  microservice-redis-data: {name: campus-microservices-redis-data}
  microservice-rabbitmq-data: {name: campus-microservices-rabbitmq-data}

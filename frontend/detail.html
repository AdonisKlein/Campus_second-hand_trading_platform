<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品详情 - 校园二手交易平台</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">航集 Campus Market</a>
        <nav aria-label="主导航">
            <a href="index.html" data-icon="⌂">首页</a>
            <a href="messages.html" data-icon="✉" data-requires-auth>消息 <span class="chat-nav-badge" data-chat-unread hidden></span></a>
            <a href="publish.html" data-icon="＋" data-requires-auth>发布物品</a>
            <a href="orders.html" data-icon="▤" data-requires-auth>订单管理</a>
            <a href="profile.html" data-icon="○">个人中心</a>
            <a href="admin.html" data-icon="◇" data-admin-only hidden>管理中心</a>
        </nav>
    </header>

    <main class="layout product-detail-page">
        <nav class="detail-breadcrumb" aria-label="面包屑">
            <a href="index.html">校园集市</a><span aria-hidden="true">/</span><span>商品详情</span>
        </nav>
        <section id="itemDetail" aria-live="polite">
            <div class="detail-loading" role="status">正在加载商品信息…</div>
        </section>

        <section class="detail-content-grid detail-content-grid--single" aria-label="商品公开问答">
            <article class="detail-section-card public-question-card">
                <div class="panel-heading">
                    <div><h2>公开问答</h2><p>所有访客可见；议价和见面地点请使用私聊。</p></div>
                    <span class="online-dot">所有访客可见</span>
                </div>
                <div id="messageList" class="message-list"></div>
                <form id="messageForm" class="message-form">
                    <label class="sr-only" for="publicQuestion">公开问题</label>
                    <textarea id="publicQuestion" name="content" rows="3" maxlength="500" placeholder="例如：原装充电器还在吗？" required></textarea>
                    <button type="submit">发布问题</button>
                </form>
            </article>

        </section>
    </main>

    <div id="mobileProductActions" class="mobile-product-actions" hidden aria-label="商品操作"></div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/detail.js"></script>
</body>
</html>

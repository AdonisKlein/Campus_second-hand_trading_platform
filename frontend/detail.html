<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品详情 - 校园二手交易平台</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">航集 Campus Market</a>
        <nav aria-label="主导航">
            <a href="index.html" data-icon="⌂">首页</a>
            <a href="publish.html" data-icon="＋">发布物品</a>
            <a href="orders.html" data-icon="▤">订单管理</a>
            <a href="profile.html" data-icon="○">个人中心</a>
            <a href="admin.html" data-icon="◇">管理中心</a>
        </nav>
    </header>

    <main class="layout">
        <a class="back-link" href="index.html">← 返回商品列表</a>
        <div class="two-column detail-layout">
        <section id="itemDetail" class="detail-panel" aria-live="polite"></section>
        <aside class="message-panel">
            <div class="panel-heading"><div><p class="section-kicker">QUESTIONS</p><h2>留言沟通</h2></div><span class="online-dot">公开留言</span></div>
            <div id="messageList" class="message-list"></div>
            <form id="messageForm" class="message-form">
                <!-- senderId and receiverId are auto-filled by JS -->
                <textarea name="content" rows="3" placeholder="输入留言内容" aria-label="留言内容" required></textarea>
                <button type="submit">发送留言</button>
            </form>
        </aside>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/detail.js"></script>
</body>
</html>

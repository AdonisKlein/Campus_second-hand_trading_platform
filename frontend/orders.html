<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 校园二手交易平台</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">航集 Campus Market</a>
        <nav aria-label="主导航">
            <a href="index.html" data-icon="⌂">首页</a>
            <a href="publish.html" data-icon="＋" data-requires-auth>发布物品</a>
            <a class="active" href="orders.html" aria-current="page" data-icon="▤" data-requires-auth>订单管理</a>
            <a href="profile.html" data-icon="○">个人中心</a>
            <a href="admin.html" data-icon="◇" data-admin-only hidden>管理中心</a>
        </nav>
    </header>

    <main class="layout">
        <section class="page-heading trade-heading">
            <div><p class="eyebrow">MY TRADES</p><h1>订单管理</h1><p>在这里跟进买入和卖出的每一笔校园交易。</p></div>
            <span id="currentUserInfo" class="user-chip"></span>
        </section>
        <div class="trade-shell">
            <aside class="trade-guide">
                <p class="section-kicker">TRADE FLOW</p><h2>交易流程</h2>
                <div class="flow-list"><div><b>1</b><span><strong>提交订单</strong><small>商品为你临时预留</small></span></div><div><b>2</b><span><strong>卖家确认</strong><small>约定校内见面地点</small></span></div><div><b>3</b><span><strong>验货完成</strong><small>买家确认后交易结束</small></span></div></div>
                <a class="text-link" href="index.html">继续逛逛 →</a>
            </aside>
            <section class="trade-list-panel"><div class="panel-heading"><div><p class="section-kicker">ALL ORDERS</p><h2>全部订单</h2></div></div><div id="orderList" class="table-list" aria-live="polite"></div></section>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/orders.js"></script>
</body>
</html>

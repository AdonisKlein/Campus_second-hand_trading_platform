<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理中心 - 校园二手交易平台</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">航集 Campus Market</a>
        <nav aria-label="主导航">
            <a href="index.html" data-icon="⌂">首页</a>
            <a href="publish.html" data-icon="＋">发布物品</a>
            <a href="orders.html" data-icon="▤">订单管理</a>
            <a href="profile.html" data-icon="○">个人中心</a>
            <a class="active" href="admin.html" aria-current="page" data-icon="◇">管理中心</a>
        </nav>
    </header>

    <main class="layout">
        <section class="page-heading admin-heading"><div><p class="eyebrow">ADMIN CONSOLE</p><h1>管理中心</h1><p>集中处理账号状态、公开留言与平台商品。</p></div><span id="adminUserInfo" class="user-chip"></span></section>

        <section id="adminGate" class="form-panel" style="display:none;">
            <p>请使用管理员账号登录后访问管理中心。</p>
            <a class="button-link" href="profile.html">前往登录</a>
        </section>

        <section id="adminPanel" class="admin-panel admin-shell" style="display:none;">
            <aside class="admin-sidebar"><div class="admin-sidebar-title"><span class="profile-avatar" aria-hidden="true">管</span><div><strong>平台管理员</strong><small>Campus Console</small></div></div>
            <div class="admin-tabs" role="tablist" aria-label="管理功能">
                <button id="adminTabUsers" type="button" class="active" role="tab" aria-selected="true" aria-controls="adminUsersPanel" tabindex="0" data-admin-tab="users"><span>用户管理</span><small>账号状态与权限</small></button>
                <button id="adminTabMessages" type="button" class="secondary" role="tab" aria-selected="false" aria-controls="adminMessagesPanel" tabindex="-1" data-admin-tab="messages"><span>留言管理</span><small>公开内容维护</small></button>
                <button id="adminTabItems" type="button" class="secondary" role="tab" aria-selected="false" aria-controls="adminItemsPanel" tabindex="-1" data-admin-tab="items"><span>商品管理</span><small>商品上下架处理</small></button>
            </div>
            <p class="admin-sidebar-note">管理操作会立即生效，请确认目标信息后再执行。</p></aside>
            <div class="admin-workspace">

            <section id="adminUsersPanel" class="admin-section" role="tabpanel" aria-labelledby="adminTabUsers" data-admin-section="users">
                <div class="section-title">
                    <h2>普通用户</h2>
                    <span id="userCount"></span>
                </div>
                <div id="adminUserList" class="table-list"></div>
            </section>

            <section id="adminMessagesPanel" class="admin-section" role="tabpanel" aria-labelledby="adminTabMessages" data-admin-section="messages" style="display:none;">
                <div class="section-title">
                    <h2>全部留言</h2>
                    <span id="messageCount"></span>
                </div>
                <div id="adminMessageList" class="table-list"></div>
            </section>

            <section id="adminItemsPanel" class="admin-section" role="tabpanel" aria-labelledby="adminTabItems" data-admin-section="items" style="display:none;">
                <div class="section-title">
                    <h2>全部商品</h2>
                    <span id="adminItemCount"></span>
                </div>
                <div id="adminItemList" class="table-list"></div>
            </section>
            </div>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>

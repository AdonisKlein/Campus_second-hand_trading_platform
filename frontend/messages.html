<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私聊消息 - 航集</title><link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/styles.css"></head>
<body class="chat-page"><header class="topbar"><a class="brand" href="index.html">航集 Campus Market</a><nav aria-label="主导航"><a href="index.html" data-icon="⌂">首页</a><a href="messages.html" class="active" aria-current="page" data-icon="✉" data-requires-auth>消息 <span class="chat-nav-badge" data-chat-unread hidden></span></a><a href="publish.html" data-icon="＋" data-requires-auth>发布物品</a><a href="orders.html" data-icon="▤" data-requires-auth>订单管理</a><a href="profile.html" data-icon="○">个人中心</a><a href="admin.html" data-icon="◇" data-admin-only hidden>管理中心</a></nav></header>
<main class="layout chat-layout"><section class="chat-shell" aria-label="私聊消息">
<aside class="chat-conversations" id="conversationPane"><div class="chat-pane-heading"><div><h1>消息</h1><span id="chatTotalUnread">0 条未读</span></div></div><label class="chat-search"><span aria-hidden="true">⌕</span><input id="conversationSearch" type="search" placeholder="搜索同学或商品" maxlength="80"></label><label class="chat-unread-filter"><input id="unreadFirst" type="checkbox"> 未读会话优先</label><div id="conversationList" class="conversation-list" role="list"></div><p id="conversationStatus" class="form-message" role="status" aria-live="polite"></p><button type="button" class="secondary chat-load-more" id="loadMoreConversations" hidden>加载更多会话</button></aside>
<section class="chat-room" id="chatRoom" hidden><header class="chat-room-header"><button type="button" class="secondary chat-back" id="chatBack" aria-label="返回会话列表">←</button><div><strong id="chatOtherName"></strong><span id="chatConnection">已连接</span></div><div class="chat-room-tools"><button type="button" class="secondary" id="reportChatUser">举报</button><button type="button" class="secondary danger" id="toggleChatBlock">屏蔽</button></div></header><a class="chat-product-strip" id="chatItemLink" href="index.html"><img id="chatItemImage" src="assets/images/placeholder.svg" alt=""><span><small>正在沟通的商品</small><strong id="chatItemTitle"></strong><em id="chatItemState"></em></span><b id="chatItemPrice"></b><i>查看商品 ›</i></a><div class="chat-history-toolbar"><button type="button" class="secondary" id="loadOlder" hidden>加载更早消息</button><span id="historyStatus"></span></div><div id="chatMessages" class="chat-messages" aria-live="polite"></div><p class="chat-safety-note">请勿提前转账或离开平台沟通，建议在校内公共场所当面验货。</p><form id="chatForm" class="chat-composer"><label class="sr-only" for="chatBody">私聊内容</label><textarea id="chatBody" name="body" maxlength="2000" rows="2" placeholder="输入消息" required></textarea><button type="submit">发送</button><p id="chatFormMessage" class="form-message" role="status" aria-live="polite"></p></form></section>
<aside class="chat-context" id="chatContext" hidden><h2>交易信息</h2><div class="chat-context-product"><img id="contextItemImage" src="assets/images/placeholder.svg" alt=""><strong id="contextItemTitle"></strong><span id="contextItemPrice"></span><em id="contextItemState"></em></div><a class="button-link secondary-link" id="contextItemLink" href="index.html">查看商品详情</a><a class="button-link secondary-link" href="orders.html" data-requires-auth>打开订单管理</a><div class="chat-context-safety"><strong>当面交易</strong><p>核对商品状态后再确认取货，不通过私聊发送验证码、密码或支付信息。</p></div></aside>
<section class="chat-empty" id="chatEmpty"><div aria-hidden="true">✉</div><h2>选择一条会话</h2><p>从左侧打开与同学的商品沟通。</p></section></section></main><script src="assets/js/api.js"></script><script src="assets/js/chat.js"></script></body></html>

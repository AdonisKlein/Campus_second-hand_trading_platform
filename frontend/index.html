<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手交易平台</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">航集 Campus Market</a>
        <nav aria-label="主导航">
            <a class="active" href="index.html" aria-current="page" data-icon="⌂">首页</a>
            <a href="publish.html" data-icon="＋">发布物品</a>
            <a href="orders.html" data-icon="▤">订单管理</a>
            <a href="profile.html" data-icon="○">个人中心</a>
            <a href="admin.html" data-icon="◇">管理中心</a>
        </nav>
    </header>

    <main class="layout">
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">BUAA CAMPUS MARKET</p>
                <h1>校园闲置，<br><span>好物流转</span></h1>
                <p>让每一件闲置重新找到需要它的人。校园身份、在线沟通、线下安心交易。</p>
                <div class="hero-points" aria-label="平台特点">
                    <span>校园用户</span><span>当面交易</span><span>轻松发布</span>
                </div>
            </div>
            <form class="search-bar" id="searchForm">
                <input id="keyword" type="search" placeholder="搜索物品关键词" aria-label="搜索物品关键词">
                <select id="category" aria-label="选择物品分类">
                    <option value="">全部分类</option>
                    <option value="书籍">书籍</option>
                    <option value="生活用品">生活用品</option>
                    <option value="电子产品">电子产品</option>
                    <option value="其他">其他</option>
                </select>
                <button type="submit">查询</button>
            </form>
        </section>

        <section class="home-section">
            <div class="section-title">
                <div><p class="section-kicker">FRESH ON CAMPUS</p><h2>最新物品</h2></div>
                <span id="itemCount" role="status" aria-live="polite">加载中</span>
            </div>
            <div class="item-grid" id="itemGrid"></div>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>

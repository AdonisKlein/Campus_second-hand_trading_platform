name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run Maven unit tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test
      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: backend/target/surefire-reports/**

  api-integration-tests:
    name: API and MySQL integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run Maven verification
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload API and MySQL reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            backend/target/failsafe-reports/**
            backend/target/reports/**
            backend/target/site/**

  frontend-static-tests:
    name: Frontend static tests
    needs: api-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend contract tests
        shell: bash
        run: node --test frontend/tests/*.test.js
      - name: Check frontend JavaScript syntax
        shell: bash
        run: find frontend/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

  e2e-tests:
    name: Playwright E2E journeys
    needs: frontend-static-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run isolated Compose E2E environment
        working-directory: e2e
        run: npm run test:e2e:compose
      - name: Upload Playwright evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: e2e/test-results/**

  build-images:
    name: Build and push versioned images
    needs: e2e-tests
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image tag
        id: version
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/adonisklein/campus-backend:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/adonisklein/campus-web:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

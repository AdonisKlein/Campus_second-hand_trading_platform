name: Microservices CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      controlled_failure:
        description: "Fail after a successful Kubernetes rollout to capture negative evidence"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: microservices-ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production deployment halfway through a main-branch release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/adonisklein

jobs:
  detect-changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.changes.outputs.summary }}
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Classify changed services
        id: changes
        shell: bash
        run: |
          node scripts/ci/detect-service-changes.mjs \
            --event "${GITHUB_EVENT_NAME}" \
            --before "${{ github.event.before }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --output test-results/changed-services.json
          summary="$(node -e "const x=require('./test-results/changed-services.json'); process.stdout.write(x.affected.join(','))")"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
      - name: Upload change classification
        uses: actions/upload-artifact@v7
        with:
          name: changed-services-${{ github.run_id }}
          path: test-results/changed-services.json

  service-tests:
    name: Verify ${{ matrix.service }}
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, account-service, marketplace-service, trading-service, governance-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run unit, API and integration tests
        working-directory: services/${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload Maven reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: maven-${{ matrix.service }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            services/${{ matrix.service }}/target/surefire-reports/**
            services/${{ matrix.service }}/target/failsafe-reports/**
            services/${{ matrix.service }}/target/reports/**

  contract-and-frontend-tests:
    name: Contract and frontend tests
    needs: service-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify UC and public API traceability
        working-directory: e2e
        run: |
          npm ci
          npm run test:e2e:routing
          npm run test:e2e:traceability
      - name: Verify versioned event contracts
        run: node scripts/ci/verify-event-contracts.mjs
      - name: Verify every public API has three-part test evidence
        run: node scripts/ci/verify-public-api-coverage.mjs
      - name: Run frontend contract tests
        run: node --test frontend/tests/*.test.js
      - name: Check frontend JavaScript syntax
        shell: bash
        run: find frontend/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify CI/CD and observability contracts
        run: node scripts/ci/verify-work-item-8.mjs

  e2e-tests:
    name: Cross-service Playwright journeys
    needs: contract-and-frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run isolated microservice environment
        working-directory: e2e
        run: npm run test:e2e:compose
      - name: Upload Playwright evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: e2e/test-results/**

  test-summary:
    name: Publish unified test report
    needs: [service-tests, contract-and-frontend-tests, e2e-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Maven test evidence
        uses: actions/download-artifact@v8
        with:
          pattern: maven-*
          path: collected-test-results/maven
          merge-multiple: false
      - name: Download Playwright test evidence
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-evidence-*
          path: collected-test-results/playwright
          merge-multiple: false
      - name: Merge JUnit reports
        shell: bash
        run: |
          mapfile -d '' reports < <(find collected-test-results -type f -name '*.xml' -print0)
          inputs=()
          for report in "${reports[@]}"; do inputs+=(--input "${report}"); done
          node scripts/ci/test-report.mjs "${inputs[@]}" \
            --output test-results/summary \
            --commit "${GITHUB_SHA}" \
            --branch "${GITHUB_REF_NAME}" \
            --environment "GitHub Actions / Java ${JAVA_VERSION} / Docker Compose"
      - name: Add report to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f test-results/summary/test-report.md ]]; then
            cat test-results/summary/test-report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No unified report was generated; inspect upstream jobs." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload unified test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unified-test-report-${{ github.run_id }}
          if-no-files-found: warn
          path: test-results/summary/**

  build-images:
    name: Build ${{ matrix.image }} image
    needs: [e2e-tests, test-summary]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: campus-gateway, context: services/api-gateway}
          - {image: campus-account, context: services/account-service}
          - {image: campus-marketplace, context: services/marketplace-service}
          - {image: campus-trading, context: services/trading-service}
          - {image: campus-governance, context: services/governance-service}
          - {image: campus-web, context: frontend}
          # Production host cannot reach Docker Hub reliably. These thin,
          # version-pinned mirrors keep every cloud pull on the same GHCR path.
          - {image: campus-mysql, context: deploy/images/mysql}
          - {image: campus-redis, context: deploy/images/redis}
          - {image: campus-rabbitmq, context: deploy/images/rabbitmq}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image tag
        id: version
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-kind:
    name: Deploy microservices to Kind
    needs: build-images
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == vars.CLOUD_DEPLOY_REF)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      K8S_EVIDENCE_DIR: test-results/k8s-deploy/${{ github.run_id }}
      KIND_CLUSTER_NAME: campus-ci-${{ github.run_id }}
      CONTROLLED_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_failure || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Kind
        shell: bash
        run: |
          curl --fail --location --output kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - name: Deploy and run health/version smoke checks
        shell: bash
        run: scripts/ci/deploy-kind.sh "${IMAGE_NAMESPACE}" "sha-${GITHUB_SHA::7}"
      - name: Add deployment report to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          report="${K8S_EVIDENCE_DIR}/summary.md"
          if [[ -f "${report}" ]]; then cat "${report}" >> "${GITHUB_STEP_SUMMARY}";
          else echo "Deployment ended before a report could be generated." >> "${GITHUB_STEP_SUMMARY}"; fi
      - name: Upload Kubernetes diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: test-results/k8s-deploy/**

  deploy-cloud:
    name: Deploy to Aliyun server
    needs: [build-images, deploy-kind]
    if: ${{ vars.CLOUD_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == vars.CLOUD_DEPLOY_REF)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://${{ vars.CLOUD_DOMAIN }}
    env:
      CLOUD_HOST: ${{ vars.CLOUD_HOST }}
      CLOUD_USER: ${{ vars.CLOUD_USER }}
      CLOUD_DEPLOY_PATH: ${{ vars.CLOUD_DEPLOY_PATH }}
      CLOUD_DOMAIN: ${{ vars.CLOUD_DOMAIN }}
      SSH_PRIVATE_KEY: ${{ secrets.CLOUD_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CLOUD_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate cloud deployment settings
        shell: bash
        run: |
          for name in CLOUD_HOST CLOUD_USER CLOUD_DEPLOY_PATH CLOUD_DOMAIN SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub environment variable or secret: ${name}" >&2; exit 1; }
          done
          [[ "${CLOUD_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${CLOUD_USER}" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${CLOUD_DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "${CLOUD_DOMAIN}" =~ ^[a-z0-9.-]+$ ]]
      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/cloud_deploy_key
          chmod 600 ~/.ssh/cloud_deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload immutable deployment release
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          tar -czf cloud-release.tgz \
            deploy/docker-compose.yml \
            deploy/docker-compose.production.yml \
            deploy/mysql/init/01-databases.sh \
            scripts/deploy/cloud-deploy.sh
          ssh -i ~/.ssh/cloud_deploy_key "${CLOUD_USER}@${CLOUD_HOST}" \
            "install -d -m 755 '${CLOUD_DEPLOY_PATH}/releases/${image_tag}'"
          scp -i ~/.ssh/cloud_deploy_key cloud-release.tgz \
            "${CLOUD_USER}@${CLOUD_HOST}:/tmp/campus-market-${GITHUB_RUN_ID}.tgz"
          ssh -i ~/.ssh/cloud_deploy_key "${CLOUD_USER}@${CLOUD_HOST}" \
            "tar -xzf '/tmp/campus-market-${GITHUB_RUN_ID}.tgz' -C '${CLOUD_DEPLOY_PATH}/releases/${image_tag}' && rm -f '/tmp/campus-market-${GITHUB_RUN_ID}.tgz'"
      - name: Deploy and run cloud health/version smoke checks
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          ssh -i ~/.ssh/cloud_deploy_key "${CLOUD_USER}@${CLOUD_HOST}" \
            "bash '${CLOUD_DEPLOY_PATH}/releases/${image_tag}/scripts/deploy/cloud-deploy.sh' '${IMAGE_NAMESPACE}' '${image_tag}' '${CLOUD_DOMAIN}' '${CLOUD_DEPLOY_PATH}'"
      - name: Download cloud deployment diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          install -d test-results/cloud-deploy
          if [[ -f ~/.ssh/cloud_deploy_key ]]; then
            scp -i ~/.ssh/cloud_deploy_key -r \
              "${CLOUD_USER}@${CLOUD_HOST}:${CLOUD_DEPLOY_PATH}/evidence/${image_tag}/." \
              test-results/cloud-deploy/ || true
          fi
      - name: Upload cloud deployment diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloud-deployment-${{ github.run_id }}
          if-no-files-found: warn
          path: test-results/cloud-deploy/**

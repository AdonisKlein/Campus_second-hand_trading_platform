name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Backend unit tests
    runs-on: ubuntu-latest

    # Checkout and tool setup stay in this job. GitHub-hosted jobs are isolated;
    # splitting these into separate jobs would require passing the workspace as
    # an artifact and would not preserve the installed JDK automatically.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Node is prepared for the later frontend/E2E jobs. It is intentionally
      # not used as a gate in this foundation round.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Run backend unit tests
        working-directory: backend
        env:
          VERIFICATION_PEPPER: ci-only-verification-pepper-at-least-32-bytes
          DB_PASSWORD: ""
        run: mvn --batch-mode --no-transfer-progress test

      # Keep this step unconditional so a failed Maven assertion still leaves
      # machine-readable Surefire XML and any diagnostic files for reviewers.
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/**/*.xml
            backend/target/surefire-reports/**/*.txt
            backend/target/reports/**/*.html
            test-results/**

      # Work item 6 will enable versioned image builds after all test gates:
      # - name: Build and push versioned backend/web images
      #   uses: docker/build-push-action@v6
      # Work item 8 will enable Kind deployment, rollout checks, and smoke tests.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      controlled_failure:
        description: "Fail after a successful Kubernetes rollout to capture negative evidence"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run Maven unit tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test
      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: backend/target/surefire-reports/**

  api-integration-tests:
    name: API and MySQL integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run Maven verification
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload API and MySQL reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            backend/target/failsafe-reports/**
            backend/target/reports/**
            backend/target/site/**

  frontend-static-tests:
    name: Frontend static tests
    needs: api-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run frontend contract tests
        shell: bash
        run: node --test frontend/tests/*.test.js
      - name: Check frontend JavaScript syntax
        shell: bash
        run: find frontend/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

  e2e-tests:
    name: Playwright E2E journeys
    needs: frontend-static-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run isolated Compose E2E environment
        working-directory: e2e
        run: npm run test:e2e:compose
      - name: Upload Playwright evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: e2e/test-results/**

  build-images:
    name: Build and push versioned images
    needs: e2e-tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image tag
        id: version
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/adonisklein/campus-backend:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/adonisklein/campus-web:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-kind:
    name: Deploy versioned images to Kind
    needs: build-images
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      K8S_EVIDENCE_DIR: test-results/k8s-deploy/${{ github.run_id }}
      KIND_CLUSTER_NAME: campus-ci-${{ github.run_id }}
      CONTROLLED_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_failure || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Kind
        shell: bash
        run: |
          curl --fail --location --output kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - name: Deploy and run smoke checks
        shell: bash
        run: |
          scripts/ci/deploy-kind.sh \
            "ghcr.io/adonisklein/campus-backend:${{ needs.build-images.outputs.image-tag }}" \
            "ghcr.io/adonisklein/campus-web:${{ needs.build-images.outputs.image-tag }}"
      - name: Add deployment report to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          report="${K8S_EVIDENCE_DIR}/summary.md"
          if [[ -f "${report}" ]]; then
            cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Deployment ended before a report could be generated." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload Kubernetes deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-deployment-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: test-results/k8s-deploy/**
